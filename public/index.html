.calendar-layout {
  display: grid;
  grid-template-columns: minmax(0px, 1fr) 290px;
  gap: 18px;
  align-items: start;
}
.calendar-panel {
  background: white;
  border: 1px solid var(--line);
  border-radius: 13px;
  overflow: hidden;
  min-width: 0px;
}
.calendar-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px;
  gap: 10px;
}
.calendar-toolbar input {
  width: 150px;
  margin-top: 7px;
}
.cal-week, .cal-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0px, 1fr));
}
.cal-week {
  background: rgb(244, 246, 241);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.cal-week span {
  text-align: center;
  padding: 9px;
  font-size: 12px;
}
.cal-week span:first-child {
  color: var(--red);
}
.cal-week span:last-child {
  color: rgb(66, 101, 139);
}
.cal-grid {
  gap: 3px;
  padding: 8px;
}
.cal-day {
  min-width: 0px;
  min-height: 98px;
  border: 0px;
  border-radius: 8px;
  padding: 7px;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  text-align: left;
  gap: 4px;
  background: white;
  font-weight: 400;
}
.cal-number {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  line-height: 1.2;
  font-size: 14px;
}
.cal-today .cal-number {
  background: var(--green);
  color: white;
  border-radius: 50%;
}
.cal-day.cal-selected {
  background: var(--light);
  box-shadow: rgb(167, 188, 174) 0px 0px 0px 1px inset;
}
.cal-holiday {
  color: var(--red);
}
.cal-saturday {
  color: rgb(66, 101, 139);
}
.cal-outside {
  opacity: 0.45;
}
.cal-holiday-label {
  font-size: 11px;
  line-height: 1.4;
  overflow-wrap: anywhere;
}
.cal-event {
  font-size: 11px;
  line-height: 1.5;
  color: var(--green);
  background: rgb(237, 242, 232);
  padding: 2px 4px;
  border-radius: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cal-done {
  text-decoration: line-through;
  opacity: 0.6;
}
.cal-more {
  font-size: 11px;
  color: var(--muted);
}
.cal-footer {
  padding: 11px 16px;
  border-top: 1px solid var(--line);
  font-size: 12px;
  color: var(--muted);
}
.calendar-agenda {
  min-width: 0px;
  padding: 18px;
  position: sticky;
  top: 14px;
}
.cal-agenda-item {
  padding: 13px 0px;
  border-bottom: 1px solid var(--line);
}
.cal-agenda-item .row {
  border: 0px;
  padding: 4px 0px 8px;
  flex-wrap: wrap;
}
.cal-agenda-item .actions {
  justify-content: flex-end;
}
.cal-clock {
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.cal-clock span {
  display: block;
  font-size: 25px;
  line-height: 1.2;
}
.cal-clock small {
  font-size: 11px;
  color: var(--muted);
}
.cal-summary {
  display: flex;
  gap: 24px;
  background: var(--light);
  border: 1px solid var(--line);
  padding: 15px 20px;
  border-radius: 12px;
  margin-bottom: 18px;
}
.cal-summary > div {
  min-width: 0px;
}
.cal-summary > div:first-child {
  min-width: 110px;
  border-right: 1px solid rgb(213, 222, 209);
  padding-right: 24px;
}
.cal-summary strong {
  display: block;
  font-size: 17px;
  overflow-wrap: anywhere;
}
.cal-sync {
  margin-top: 18px;
}
.cal-sync p {
  margin-bottom: 8px;
}

.cal-week span:first-child, .cal-week span:last-child, .cal-holiday .cal-number, .cal-saturday .cal-number, .cal-holiday-label {

.cal-day.cal-holiday {
